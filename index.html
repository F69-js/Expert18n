<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>expert18n - Ultimate Studio</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #151d30;
      --text: #f1f5f9;
      --accent: #38bdf8;
      --border: #1e293b;
      --warn: #fbbf24;
      --success: #34d399;
      --btn-bg: #2563eb;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px;
    }
    h1 { color: var(--accent); margin-bottom: 5px; }
    .meta { font-style: italic; color: #64748b; margin-bottom: 30px; }
    
    .layout { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
    .panel { background: var(--card); border: 1px solid var(--border); padding: 25px; border-radius: 12px; }
    h3 { margin-top: 0; color: #e2e8f0; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
    
    /* エディタ部分のスタイル */
    .editor-section { margin-bottom: 25px; }
    .lang-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .lang-title { font-weight: bold; font-size: 16px; color: var(--accent); }
    .kv-row { display: flex; gap: 10px; margin-bottom: 8px; align-items: center; }
    input[type="text"], select {
      background: #090d16;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 14px;
    }
    input:focus, select:focus { border-color: var(--accent); outline: none; }
    .key-input { width: 30%; font-family: monospace; }
    .val-input { width: 60%; }
    
    .btn {
      background: var(--btn-bg);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
    }
    .btn:hover { opacity: 0.9; }
    .btn-add { background: #10b981; padding: 4px 10px; font-size: 12px; }
    .btn-del { background: #ef4444; padding: 6px 10px; font-size: 12px; }

    /* シミュレータ側 */
    .control-row { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; }
    .control-row label { font-size: 14px; font-weight: bold; min-width: 140px; }
    
    /* ターミナル風コンソール */
    .console-terminal {
      background: #05070c;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 15px;
      font-family: 'Fira Code', monospace;
      font-size: 14px;
      margin-top: 20px;
      min-height: 180px;
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.8);
    }
    .console-line { margin-bottom: 8px; line-height: 1.4; }
    .line-input { color: #64748b; }
    .line-output { color: var(--success); font-weight: bold; padding-left: 15px; }
    .line-warn { color: var(--warn); padding-left: 15px; }
  </style>
</head>
<body>

  <!-- ページ全体の多言語化（i18nターゲット要素） -->
  <h1 id="ui-title">Expert18n Studio</h1>
  <div class="meta" id="ui-meta">Interactive Visual Dashboard</div>

  <div class="layout">
    
    <!-- 📄 左パネル: ビジュアル・リソースエディタ -->
    <div class="panel">
      <h3 id="ui-editor-title">Resource Dictionary</h3>
      
      <!-- 🇬🇧 英語リソース追加用 -->
      <div class="editor-section">
        <div class="lang-header">
          <span class="lang-title">🇺🇸 English (en)</span>
          <button class="btn btn-add" onclick="addPair('en')">＋ Add Key</button>
        </div>
        <div id="container-en"></div>
      </div>

      <!-- 🇯🇵 日本語リソース追加用 -->
      <div class="editor-section">
        <div class="lang-header">
          <span class="lang-title">🇯🇵 日本語 (ja)</span>
          <button class="btn btn-add" onclick="addPair('ja')">＋ Add Key</button>
        </div>
        <div id="container-ja"></div>
      </div>
    </div>

    <!-- ⚙️ 右パネル: ライブシミュレータ＆Console -->
    <div class="panel">
      <h3 id="ui-sim-title">Simulator & Terminal</h3>
      
      <div class="control-row">
        <label id="ui-label-lang">System Language:</label>
        <div id="switcher-container"></div>
      </div>

      <div class="control-row">
        <label id="ui-label-count">count (Number):</label>
        <select id="sim-count" onchange="runTranslation()">
          <option value="1">1</option>
          <option value="3">3</option>
          <option value="5">5</option>
        </select>
      </div>

      <div class="control-row">
        <label id="ui-label-item">item (String):</label>
        <select id="sim-item" onchange="runTranslation()">
          <option value="apple/リンゴ">apple / リンゴ</option>
          <option value="box/箱">box / 箱</option>
          <option value="child/子供">child / 子供</option>
        </select>
      </div>

      <div class="control-row">
        <label id="ui-label-total">total (Float):</label>
        <select id="sim-total" onchange="runTranslation()">
          <option value="12530.45">12530.45</option>
          <option value="850">850</option>
        </select>
      </div>

      <!-- キー送信フォーム -->
      <div class="control-row" style="margin-top: 25px; background: #090d16; padding: 15px; border-radius: 8px; border: 1px dashed var(--border);">
        <label id="ui-label-call" style="min-width: 90px;">Call Key:</label>
        <input type="text" id="sim-key" value="cart.info" style="flex-grow: 1; font-family: monospace;" onkeydown="if(event.key==='Enter') runTranslation()">
        <button class="btn" id="ui-btn-send" onclick="runTranslation()" style="margin-left: 10px;">Send</button>
      </div>

      <!-- 🖥️ リッチなConsole風ログ表示 -->
      <div class="console-terminal" id="terminal-box">
        <!-- ログがここに流れる -->
      </div>
    </div>

  </div>

 <script type="module">
  import Expert18n from './src/exp18n.js';

  // プレイグラウンド画面自体を多言語化するための辞書データ（システムに内蔵）
  const sysUiLocales = {
    en: {
      title: "expert18n 🚀 Ultimate Visual Studio",
      meta: "Visual resource builder and compiler",
      editorTitle: "Resource Dictionary Matrix",
      simTitle: "Live Execution Terminal",
      labelLang: "Active Language:",
      labelCount: "Variable {count}:",
      labelItem: "Variable {item}:",
      labelTotal: "Variable {total}:",
      labelCall: "Execute Key:",
      btnSend: "RUN"
    },
    ja: {
      title: "expert18n 🚀 究極のビジュアル・スタジオ",
      meta: "視覚的リソース構築・コンパイル環境",
      editorTitle: "リソース辞書マトリクス",
      simTitle: "ライブ実行ターミナル",
      labelLang: "稼働言語設定:",
      labelCount: "変数 {count}:",
      labelItem: "変数 {item}:",
      labelTotal: "変数 {total}:",
      labelCall: "実行キー入力:",
      btnSend: "翻訳送信"
    }
  };

  // デフォルトの初期リソースデータ構造
  const defaultData = {
    en: [
      { k: "cart.info", v: "On {valDate, date}, you purchased {count} {item} for {total, currency}." }
    ],
    ja: [
      { k: "cart.info", v: "{valDate, date}に、{total, currency}で{item}を{count}個購入しました。" }
    ]
  };

  // ライブラリの初期化設定
  window.Expert18n = Expert18n;
  Expert18n.language = 'ja';

  // 画面のセレクトボックスUIを自動生成して設置
  const selectUi = Expert18n.createSelect('lang-picker', 'ja');
  document.getElementById('switcher-container').appendChild(selectUi);

  // 🌟 修正: onclick から呼び出せるように window.addPair としてグローバルにバインド！
  window.addPair = function(lang, k = "", v = "") {
    const container = document.getElementById(`container-${lang}`);
    const row = document.createElement('div');
    row.className = 'kv-row';
    row.innerHTML = `
      <input type="text" class="key-input" value="${k}" placeholder="e.g. error.404" onblur="window.compileAndRender()" onkeydown="if(event.key==='Enter') this.blur()">
      <input type="text" class="val-input" value="${v}" placeholder="Translation string..." onblur="window.compileAndRender()" onkeydown="if(event.key==='Enter') this.blur()">
      <button class="btn btn-del" onclick="this.parentElement.remove(); window.compileAndRender();">✕</button>
    `;
    container.appendChild(row);
  };

  // 画面上の入力フォームからデータを集めて、Expert18n.textlistを再構築する関数
  window.compileAndRender = function() {
    const textlist = { en: {}, ja: {} };

    ['en', 'ja'].forEach(lang => {
      const container = document.getElementById(`container-${lang}`);
      if (!container) return;
      const rows = container.getElementsByClassName('kv-row');
      
      for (let row of rows) {
        const k = row.getElementsByClassName('key-input')[0].value.trim();
        const v = row.getElementsByClassName('val-input')[0].value;
        
        if (!k) continue;

        const parts = k.split('.');
        let current = textlist[lang];
        for (let i = 0; i < parts.length; i++) {
          const p = parts[i];
          if (i === parts.length - 1) {
            current[p] = v;
          } else {
            current[p] = current[p] || {};
            current = current[p];
          }
        }
      }
    });

    Expert18n.textlist = textlist;
    translatePageUi();
    window.runTranslation();
  };

  // プレイグラウンド画面の各ラベルを多言語化する関数
 function translatePageUi() {
    // 🌟 修正：深い階層を作らず、現在の言語のUI辞書を直接 textlist.sysUi にガチッと結合
    Expert18n.textlist[Expert18n.language].sysUi = sysUiLocales[Expert18n.language];

    document.getElementById('ui-title').textContent = Expert18n.for('sysUi.title');
    document.getElementById('ui-meta').textContent = Expert18n.for('sysUi.meta');
    document.getElementById('ui-editor-title').textContent = Expert18n.for('sysUi.editorTitle');
    document.getElementById('ui-sim-title').textContent = Expert18n.for('sysUi.simTitle');
    document.getElementById('ui-label-lang').textContent = Expert18n.for('sysUi.labelLang');
    document.getElementById('ui-label-count').textContent = Expert18n.for('sysUi.labelCount');
    document.getElementById('ui-label-item').textContent = Expert18n.for('sysUi.labelItem');
    document.getElementById('ui-label-total').textContent = Expert18n.for('sysUi.labelTotal');
    document.getElementById('ui-label-call').textContent = Expert18n.for('sysUi.labelCall');
    document.getElementById('ui-btn-send').textContent = Expert18n.for('sysUi.btnSend');
  }
  // 🖥️ ターミナル風にログを出力するメイン翻訳関数
  window.runTranslation = function() {
    const key = document.getElementById('sim-key').value.trim();
    const count = parseInt(document.getElementById('sim-count').value, 10);
    const total = parseFloat(document.getElementById('sim-total').value);
    
    const [enItem, jaItem] = document.getElementById('sim-item').value.split('/');
    const selectedItem = Expert18n.language === 'en' ? enItem : jaItem;

    const terminal = document.getElementById('terminal-box');
    terminal.innerHTML = ""; 

    const cmdLine = document.createElement('div');
    cmdLine.className = 'console-line line-input';
    cmdLine.textContent = `> Expert18n.for("${key}", { count: ${count}, item: "${selectedItem}", total: ${total} })`;
    terminal.appendChild(cmdLine);

    let capturedWarn = "";
    const originalWarn = console.warn;
    console.warn = (msg) => { capturedWarn = msg; };

    const result = Expert18n.for(key, {
      valDate: new Date('2026-11-01'),
      count: count,
      item: selectedItem,
      total: total
    });

    console.warn = originalWarn;

    if (capturedWarn) {
      const warnLine = document.createElement('div');
      warnLine.className = 'console-line line-warn';
      warnLine.textContent = `⚠️ ${capturedWarn}`;
      terminal.appendChild(warnLine);
    }

    const outLine = document.createElement('div');
    outLine.className = 'console-line line-output';
    outLine.textContent = `=> "${result}"`;
    terminal.appendChild(outLine);
  };

  // 初期データのロード
  defaultData.en.forEach(item => window.addPair('en', item.k, item.v));
  defaultData.ja.forEach(item => window.addPair('ja', item.k, item.v));

  // 言語ピッカー変更時の処理
  selectUi.addEventListener('change', (e) => {
    Expert18n.language = e.target.value;
    window.compileAndRender();
  });

  // 初回コンパイル＆実行
  window.compileAndRender();
</script>
